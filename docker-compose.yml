version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_server
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=xxxx
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://metal-formation-eval-suites.trycloudflare.com
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Almaty
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
